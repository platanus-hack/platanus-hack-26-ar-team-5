<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Pacta audit DAG: three lanes (Aria, Atlas, Tribunal) with signed nodes connected to a root hash" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="900" height="320" fill="#0a0c10" />

  <!-- lane separators -->
  <line x1="130" x2="900" y1="40" y2="40" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="130" x2="900" y1="130" y2="130" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="130" x2="900" y1="220" y2="220" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="130" x2="900" y1="310" y2="310" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- lane labels -->
  <g>
    <text x="20" y="77" font-size="9" font-weight="500" letter-spacing="0.18em" fill="rgba(231,197,154,0.85)">CLAIMANT</text>
    <text x="20" y="93" font-size="13" font-weight="500" fill="rgba(255,255,255,0.92)">Aria</text>
  </g>
  <g>
    <text x="20" y="167" font-size="9" font-weight="500" letter-spacing="0.18em" fill="rgba(122,162,247,0.85)">RESPONDENT</text>
    <text x="20" y="183" font-size="13" font-weight="500" fill="rgba(255,255,255,0.92)">Atlas</text>
  </g>
  <g>
    <text x="20" y="257" font-size="9" font-weight="500" letter-spacing="0.18em" fill="rgba(192,132,252,0.85)">ARBITER</text>
    <text x="20" y="273" font-size="13" font-weight="500" fill="rgba(255,255,255,0.92)">Tribunal</text>
  </g>

  <!-- edges -->
  <path d="M 200 85 C 240 85, 240 175, 280 175" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <path d="M 320 175 C 360 175, 360 85, 400 85" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <path d="M 420 85 C 470 85, 470 265, 540 265" fill="none" stroke="rgba(192,132,252,0.35)" stroke-width="1.5"/>
  <path d="M 420 85 C 470 85, 470 265, 605 265" fill="none" stroke="rgba(192,132,252,0.35)" stroke-width="1.5"/>
  <path d="M 420 85 C 470 85, 470 265, 670 265" fill="none" stroke="rgba(192,132,252,0.35)" stroke-width="1.5"/>
  <path d="M 560 265 L 740 265" fill="none" stroke="rgba(192,132,252,0.35)" stroke-width="1.5"/>
  <path d="M 625 265 L 740 265" fill="none" stroke="rgba(192,132,252,0.35)" stroke-width="1.5"/>
  <path d="M 690 265 L 740 265" fill="none" stroke="rgba(192,132,252,0.35)" stroke-width="1.5"/>
  <path d="M 760 265 L 845 265" fill="none" stroke="rgba(231,197,154,0.5)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- nodes -->
  <!-- aria m1 Propose -->
  <g>
    <circle cx="180" cy="85" r="15" fill="#A4F4FD"/>
    <text x="180" y="89" text-anchor="middle" font-size="12" font-weight="600" fill="#0c0c0c">·</text>
    <text x="180" y="117" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.78)">Propose</text>
    <text x="180" y="131" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">m1 · $1,800</text>
  </g>

  <!-- atlas m2 Counter -->
  <g>
    <circle cx="300" cy="175" r="15" fill="#7AA2F7"/>
    <text x="300" y="179" text-anchor="middle" font-size="12" font-weight="600" fill="#0c0c0c">↺</text>
    <text x="300" y="207" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.78)">Counter</text>
    <text x="300" y="221" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">m2 · $600</text>
  </g>

  <!-- aria m3 Escalate -->
  <g>
    <circle cx="420" cy="85" r="15" fill="#FF7A59"/>
    <text x="420" y="89" text-anchor="middle" font-size="12" font-weight="600" fill="#0c0c0c">↗</text>
    <text x="420" y="117" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.78)">Escalate</text>
    <text x="420" y="131" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">m3 · force majeure?</text>
  </g>

  <!-- tribunal: Aequitas -->
  <g>
    <circle cx="540" cy="265" r="15" fill="#C084FC"/>
    <text x="540" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#0c0c0c">⚖</text>
    <text x="540" y="297" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.78)">Aequitas</text>
    <text x="540" y="311" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">partial · 72%</text>
  </g>

  <!-- tribunal: Utilis -->
  <g>
    <circle cx="605" cy="265" r="15" fill="#C084FC"/>
    <text x="605" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#0c0c0c">⚖</text>
    <text x="605" y="297" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.78)">Utilis</text>
    <text x="605" y="311" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">partial · 78%</text>
  </g>

  <!-- tribunal: Velox -->
  <g>
    <circle cx="670" cy="265" r="15" fill="#C084FC"/>
    <text x="670" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#0c0c0c">⚖</text>
    <text x="670" y="297" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.78)">Velox</text>
    <text x="670" y="311" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">respondent · 82%</text>
  </g>

  <!-- ruling -->
  <g>
    <circle cx="750" cy="265" r="22" fill="none" stroke="#C084FC" stroke-opacity="0.35"/>
    <circle cx="750" cy="265" r="15" fill="#C084FC"/>
    <text x="750" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#0c0c0c">§</text>
    <text x="750" y="297" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.78)">Ruling</text>
    <text x="750" y="311" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">$600 · partial</text>
  </g>

  <!-- root hash -->
  <g>
    <circle cx="860" cy="265" r="15" fill="transparent" stroke="#E7C59A" stroke-width="1.5"/>
    <text x="860" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#E7C59A">⚿</text>
    <text x="860" y="297" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.78)">Root</text>
    <text x="860" y="311" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">sha256:84557e…</text>
  </g>
</svg>
